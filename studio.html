<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F1EEE7'/%3E%3Cellipse cx='16' cy='19' rx='9' ry='9.5' fill='%23F7A81B'/%3E%3Cellipse cx='16' cy='14.5' rx='8' ry='4.5' fill='%23EE6A1B' opacity='.8'/%3E%3Cellipse cx='12' cy='17' rx='1.8' ry='2.6' fill='%23FFE0A0' opacity='.85'/%3E%3Cpath d='M17 9c1.2-2.8 4-3.6 6-2.6-1 2.8-3.4 3.8-6 2.6z' fill='%2357A23A'/%3E%3Cpath d='M16.5 11c-.4-1.6-.2-3 .8-4.2' fill='none' stroke='%237A5230' stroke-width='1.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack-all.js"></script>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* re-branded to the gallery language: single cobalt accent (brightened for dark UI),
     warm-neutral dark canvas, Bricolage + Instrument Sans + JetBrains Mono */
  --acc:#5B77FF;--acc2:#5B77FF;--acc3:#5B77FF;
  --bd:rgba(255,255,255,.09);--bd2:rgba(255,255,255,.17);
  --surf:rgba(255,255,255,.04);--surf2:rgba(255,255,255,.075);
  --txt:#F1EEE7;--mut:#9c988d;--bg:#14130F;
  --ui:'Instrument Sans','Inter',system-ui,-apple-system,sans-serif;
  --display:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --shadow:0 20px 55px rgba(0,0,0,.5)
}
html,body{height:100%}
body{font-family:var(--ui);font-size:13px;letter-spacing:-.006em;background:
  radial-gradient(1100px 740px at 92% -12%,rgba(91,119,255,.10),transparent 56%),
  radial-gradient(940px 640px at -6% 112%,rgba(91,119,255,.06),transparent 56%),
  var(--bg);color:var(--txt);overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:6px}::-webkit-scrollbar-track{background:transparent}

#shell{display:grid;grid-template-rows:auto 1fr;height:100vh}

/* TOPBAR */
header{display:flex;align-items:center;gap:13px;padding:0 20px;height:62px;border-bottom:1px solid var(--bd);background:linear-gradient(180deg,rgba(13,17,28,.92),rgba(8,11,18,.7));backdrop-filter:blur(22px) saturate(150%)}
.logo{display:flex;align-items:center;gap:12px}
.logo .dot{position:relative;width:30px;height:30px;border-radius:9px;background:linear-gradient(140deg,var(--acc),var(--acc2) 58%,var(--acc3));box-shadow:0 6px 20px rgba(84,208,255,.4),inset 0 1px 0 rgba(255,255,255,.4)}
.logo .dot::after{content:'';position:absolute;inset:8px 8px auto 8px;height:5px;border-radius:3px;background:rgba(4,10,20,.5)}
.logo .wm{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.03em;line-height:1;background:linear-gradient(100deg,#fff,#bcd4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{font-family:var(--ui);font-weight:600;font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--mut);display:block;margin-top:3px}
.chip{font-family:var(--display);font-weight:700;font-size:10px;letter-spacing:.1em;color:var(--acc);border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);background:color-mix(in srgb,var(--acc) 12%,transparent);padding:3px 9px;border-radius:100px}
.spacer{flex:1}
.tbtn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:11px;border:1px solid var(--bd2);background:var(--surf);color:var(--txt);font-family:var(--ui);font-size:12.5px;font-weight:600;cursor:pointer;transition:.18s}
.tbtn:hover{background:var(--surf2);border-color:color-mix(in srgb,var(--acc) 55%,var(--bd2));transform:translateY(-1px)}
.tbtn.primary{background:var(--acc);border:none;color:#fff;font-weight:700;box-shadow:0 8px 22px rgba(91,119,255,.28)}
.tbtn svg{width:15px;height:15px}
.savedot{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:500;color:var(--mut)}
.savedot i{width:7px;height:7px;border-radius:50%;background:#43e08a;box-shadow:0 0 10px #43e08a;font-style:normal;animation:pulseDot 2.4s ease-in-out infinite}
@keyframes pulseDot{50%{opacity:.35}}

/* MAIN */
#main{display:grid;grid-template-columns:400px 1fr;grid-template-rows:minmax(0,1fr);min-height:0}
#panel{border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0;background:linear-gradient(180deg,rgba(11,15,25,.55),rgba(8,11,18,.18))}
.tabs{display:flex;gap:3px;padding:14px 14px 0}
.tab{flex:1;padding:10px 6px;border-radius:11px 11px 0 0;border:1px solid transparent;border-bottom:none;background:none;color:var(--mut);font-family:var(--ui);font-size:11.5px;font-weight:600;cursor:pointer;transition:.16s;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;position:relative}
.tab.on{color:var(--txt);background:var(--surf);border-color:var(--bd)}
.tab.on::after{content:'';position:absolute;left:12px;right:12px;bottom:-1px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.tab:hover{color:var(--txt)}
.tab svg{width:15px;height:15px}
.tabwrap{flex:1;overflow-y:auto;padding:16px}
.pane{display:none;animation:fade .3s}
.pane.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.grp{margin-bottom:22px}
.grp>label,.glabel{display:flex;align-items:center;gap:9px;font-family:var(--ui);font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-bottom:13px}
.grp>label::before,.glabel::before{content:'';width:16px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--acc),var(--acc2));flex-shrink:0}
.f{margin-bottom:12px}
.f>span{display:block;font-size:12px;color:var(--mut);margin-bottom:5px}
input[type=text],input[type=url],input[type=email],textarea,select{width:100%;background:var(--surf);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;font-family:var(--ui);font-size:13px;outline:none;transition:.16s;box-shadow:inset 0 1px 0 rgba(255,255,255,.02)}
input::placeholder,textarea::placeholder{color:color-mix(in srgb,var(--mut) 78%,transparent)}
input:focus,textarea:focus,select:focus{border-color:color-mix(in srgb,var(--acc) 70%,transparent);background:var(--surf2);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 14%,transparent)}
textarea{resize:vertical;min-height:70px;line-height:1.5}
select{cursor:pointer}
select option{background:#0c1420}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* color + slider */
.colorrow{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.colorrow label{flex:1;font-size:12.5px;color:var(--mut)}
.swatch{position:relative;width:40px;height:32px;border-radius:9px;border:1px solid var(--bd2);overflow:hidden;cursor:pointer;flex-shrink:0}
.swatch input{position:absolute;inset:-6px;width:150%;height:150%;border:none;padding:0;cursor:pointer;background:none}
.slider{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.slider>span{font-size:12.5px;color:var(--mut);min-width:74px}
.slider input[type=range]{flex:1;accent-color:var(--acc)}
.slider b{font-size:12px;min-width:34px;text-align:right;color:var(--txt);font-weight:500}

/* toggle */
.tog{display:flex;align-items:center;justify-content:space-between;padding:9px 0;font-size:13px}
.sw{position:relative;width:40px;height:23px;border-radius:20px;background:var(--surf2);border:1px solid var(--bd2);cursor:pointer;transition:.2s;flex-shrink:0}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:var(--mut);transition:.2s}
.sw.on{background:linear-gradient(120deg,var(--acc),var(--acc2));border-color:transparent}
.sw.on::after{transform:translateX(17px);background:#fff}

/* presets */
.presets{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pre{border:1px solid var(--bd);border-radius:11px;padding:10px;cursor:pointer;text-align:left;background:var(--surf);transition:.16s;overflow:hidden}
.pre:hover{border-color:var(--acc);transform:translateY(-2px)}
.pre.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.pre .bar{display:flex;gap:4px;margin-bottom:8px}
.pre .bar i{width:20px;height:20px;border-radius:6px;font-style:normal}
.pre .nm{font-size:12.5px;font-weight:600}
.pre .ds{font-size:10.5px;color:var(--mut)}

/* describe */
.describe{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 13%,transparent),color-mix(in srgb,var(--acc2) 11%,transparent));border:1px solid var(--bd2);border-radius:14px;padding:14px}
.describe textarea{min-height:56px;background:rgba(0,0,0,.25)}
.exs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ex{font-size:11px;padding:5px 10px;border-radius:100px;background:rgba(255,255,255,.06);border:1px solid var(--bd);cursor:pointer;color:var(--mut);transition:.16s}
.ex:hover{color:var(--txt);border-color:var(--acc)}
.note{font-size:11.5px;color:var(--acc);margin-top:9px;min-height:16px;opacity:0;transition:.3s}
.note.show{opacity:1}

/* list items */
.item{border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:11px;background:var(--surf);position:relative}
.item .hd{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.item .hd .drag{cursor:grab;color:var(--mut);font-size:16px;line-height:1}
.item .hd .ti{flex:1;font-family:var(--display);font-weight:700;font-size:13.5px;letter-spacing:-.01em}
.iconbtn{width:28px;height:28px;border-radius:8px;border:1px solid var(--bd);background:var(--surf);color:var(--mut);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.16s}
.iconbtn:hover{color:#ff7a7a;border-color:#ff7a7a}
.iconbtn svg{width:14px;height:14px}
.addbtn{width:100%;padding:11px;border:1px dashed var(--bd2);border-radius:11px;background:none;color:var(--mut);font-size:13px;cursor:pointer;transition:.16s;display:flex;align-items:center;justify-content:center;gap:7px}
.addbtn:hover{color:var(--txt);border-color:var(--acc);background:var(--surf)}

/* upload */
.drop{border:1.5px dashed var(--bd2);border-radius:13px;padding:26px 16px;text-align:center;cursor:pointer;transition:.18s;color:var(--mut)}
.drop:hover,.drop.over{border-color:var(--acc);background:rgba(91,119,255,.06);color:var(--txt)}
.drop svg{width:30px;height:30px;margin-bottom:8px;opacity:.7}
.drop b{color:var(--txt)}
.thumbrow{display:flex;align-items:center;gap:10px;margin-top:10px}
.thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;border:1px solid var(--bd2);background:var(--surf2)}
.assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;margin-top:14px}
.asset{position:relative;border-radius:11px;overflow:hidden;border:1px solid var(--bd);aspect-ratio:1;cursor:pointer;background:var(--surf)}
.asset img{width:100%;height:100%;object-fit:cover}
.asset .assetfile{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;color:var(--mut);text-align:center}
.asset .assetfile svg{width:26px;height:26px;color:var(--acc)}
.asset .assetfile span{font-size:9.5px;line-height:1.2;word-break:break-all;color:var(--txt)}
.asset .ov{position:absolute;inset:0;background:rgba(4,10,20,.72);opacity:0;transition:.16s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:5px}
.asset:hover .ov{opacity:1}
.asset .ov button{font-size:10px;padding:4px 8px;border-radius:7px;border:1px solid var(--bd2);background:var(--surf2);color:var(--txt);cursor:pointer;width:100%}
.asset .ov button:hover{border-color:var(--acc)}
.miniup{font-size:11px;color:var(--acc);cursor:pointer;text-decoration:underline;background:none;border:none;padding:0}

/* preview */
#preview-wrap{position:relative;min-width:0;background:radial-gradient(1200px 800px at 50% -20%,rgba(91,119,255,.06),transparent 60%),#100F0C;display:flex;flex-direction:column}
.pvbar{display:flex;align-items:center;gap:10px;padding:9px 15px;border-bottom:1px solid var(--bd);font-size:11.5px;color:var(--mut);background:rgba(0,0,0,.22)}
.pvbar .dots{display:flex;gap:6px}.pvbar .dots i{width:10px;height:10px;border-radius:50%;font-style:normal}
.pvbar .dots i:nth-child(1){background:#ff5f57}.pvbar .dots i:nth-child(2){background:#febc2e}.pvbar .dots i:nth-child(3){background:#28c840}
.pvbar .url{flex:1;background:var(--surf);border:1px solid var(--bd);border-radius:8px;padding:6px 12px;font-size:11px;color:var(--mut);font-family:var(--mono);text-align:center}
.vp{display:flex;gap:3px}
.vp button{padding:5px 9px;border-radius:7px;border:1px solid var(--bd);background:var(--surf);color:var(--mut);cursor:pointer;font-size:11px}
.vp button.on{color:var(--txt);border-color:var(--acc);background:var(--surf2)}
#frameHost{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
#preview{width:100%;height:100%;border:none;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5);background:#F1EEE7;transition:width .3s,height .3s}
#preview.tablet{width:834px;height:96%;max-width:100%}
#preview.mobile{width:390px;height:96%;max-width:100%}

/* CANVAS / LAYOUT EDITOR */
.cvbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.cvbar button{padding:7px 10px;border-radius:9px;border:1px solid var(--bd2);background:var(--surf);color:var(--txt);font-size:11.5px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.cvbar button:hover{border-color:var(--acc)}
.cvbar button svg{width:13px;height:13px}
.cvstage-wrap{position:relative;border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:#04080f;margin-bottom:14px}
.cvstage{position:relative;transform-origin:top left}
.cvstage .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:20px 20px;pointer-events:none}
.cvel{position:absolute;box-sizing:border-box;cursor:grab;user-select:none;overflow:hidden}
.cvel.sel{outline:2px solid var(--acc);outline-offset:0}
.cvel.dragging{cursor:grabbing}
.cvel .lbl{position:absolute;top:0;left:0;font-size:9px;background:var(--acc);color:#04101c;padding:1px 5px;border-bottom-right-radius:6px;pointer-events:none;opacity:0;transition:.12s}
.cvel.sel .lbl{opacity:1}
.cvel.cvtext{white-space:pre-wrap;word-break:break-word;padding:6px}
.cvel.cvimage img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.cvel.cvmodel{background:#061019;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:11px}
.cvel .h{position:absolute;width:11px;height:11px;background:var(--acc);border:1.5px solid #04101c;border-radius:50%;z-index:5}
.cvel .h.nw{left:-6px;top:-6px;cursor:nwse-resize}
.cvel .h.ne{right:-6px;top:-6px;cursor:nesw-resize}
.cvel .h.sw{left:-6px;bottom:-6px;cursor:nesw-resize}
.cvel .h.se{right:-6px;bottom:-6px;cursor:nwse-resize}
.cvel .h.e{right:-6px;top:calc(50% - 5px);cursor:ew-resize}
.cvel .h.s{left:calc(50% - 5px);bottom:-6px;cursor:ns-resize}
.cvempty{color:var(--mut);font-size:12px;text-align:center;padding:20px}

/* ===== iOS-STYLE GRID EDITOR (GridStack) on the main preview canvas ===== */
#gridEditor{display:none;width:100%;max-width:1200px;margin:0 auto;align-self:flex-start}
#preview-wrap.editmode #preview{display:none}
#preview-wrap.editmode #gridEditor{display:block}
#preview-wrap.editmode #frameHost{display:block;overflow:auto}
.gezoom{display:none!important}
#preview-wrap.editmode .gezoom{display:inline-flex!important}
.gezoom .zlbl{min-width:48px;cursor:pointer}
@keyframes wflash{0%,100%{box-shadow:0 0 0 1px var(--acc)}30%{box-shadow:0 0 0 3px var(--acc),0 0 26px rgba(79,195,247,.65)}}
.grid-stack-item.flash>.grid-stack-item-content{animation:wflash 1s ease}
.genprev{margin-top:10px}
.genprev img{width:100%;border-radius:12px;border:1px solid var(--bd2);display:block}
.genok{font-size:11.5px;color:#7fe0a6;margin-top:7px}
.genspin{width:30px;height:30px;border-radius:50%;border:3px solid var(--bd2);border-top-color:var(--acc);animation:v3dspin .8s linear infinite;margin:16px auto}
.genwait{font-size:11px;color:var(--mut);text-align:center;margin-top:6px}
.genactions{display:flex;gap:8px;margin-top:9px}
.genactions .tbtn{flex:1;justify-content:center;font-size:11.5px;padding:7px}
.genfail{font-size:12px;color:#ff9a9a;padding:12px;text-align:center;border:1px solid rgba(255,120,120,.3);border-radius:11px}
.pvmode button[data-pm]{min-width:64px}
.ge-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.ge-head .ge-t{font-size:12.5px;color:var(--mut)}
.ge-head .ge-t b{color:var(--txt)}
.ge-add{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto;align-items:center}
.ge-add button{padding:6px 10px;border-radius:9px;border:1px solid var(--bd2);background:var(--surf);color:var(--txt);font-size:11.5px;cursor:pointer}
.ge-add button:hover{border-color:var(--acc);background:var(--surf2)}
.ge-note{padding:30px 20px;text-align:center;color:var(--mut);font-size:13px;line-height:1.7;border:1.5px dashed var(--bd2);border-radius:16px;background:var(--surf)}
.ge-sec{margin-bottom:26px}
.ge-sec.active{outline:1px solid rgba(79,195,247,.35);outline-offset:6px;border-radius:16px}
.ge-sechd{position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:9px 6px;margin-bottom:8px;background:linear-gradient(180deg,#04080f 72%,rgba(4,8,15,0))}
.ge-sechd.active .ge-secname{color:var(--acc)}
.ge-secname{font-weight:600;font-size:13px;color:var(--txt)}
.ge-sechd .ge-add{margin-left:auto}
.ge-addsec{width:100%;margin-top:2px}
.grid-stack{border:1px solid var(--bd);border-radius:16px;min-height:220px;background-image:
  linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px)}
.grid-stack-item-content{border-radius:14px;background:var(--surf2);border:1px solid var(--bd2);overflow:hidden;display:flex;color:var(--txt);box-shadow:0 6px 20px rgba(0,0,0,.28)}
.grid-stack-item.sel>.grid-stack-item-content{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 8px 26px rgba(79,195,247,.22)}
.wgt{position:relative;width:100%;height:100%;display:flex;flex-direction:column}
.wbody{flex:1;min-height:0;width:100%;padding:10px;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.wbody[contenteditable=true]{cursor:text;outline:none;white-space:pre-wrap;word-break:break-word}
.wbody img{width:100%;height:100%;object-fit:cover;border-radius:9px}
.wph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;height:100%;color:var(--mut);font-size:11.5px;text-align:center;padding:6px}
.wph svg{width:22px;height:22px;opacity:.7}
.wtool{position:absolute;top:6px;right:6px;display:flex;gap:4px;opacity:0;transition:.15s;z-index:6}
.grid-stack-item-content:hover .wtool,.grid-stack-item.sel .wtool{opacity:1}

<script type="module">
/* ================= SHARED 3D VIEWER (Three.js via CDN ESM) ================= */
let _threeMods=null;
async function loadThree(){
  if(_threeMods) return _threeMods;
  // bare specifiers resolved by the <script type="importmap"> in <head>
  const THREE=await import('three');
  const [{OrbitControls},{GLTFLoader},{OBJLoader},{RoomEnvironment}]=await Promise.all([
    import('three/addons/controls/OrbitControls.js'),
    import('three/addons/loaders/GLTFLoader.js'),
    import('three/addons/loaders/OBJLoader.js'),
    import('three/addons/environments/RoomEnvironment.js')
  ]);
  _threeMods={THREE,OrbitControls,GLTFLoader,OBJLoader,RoomEnvironment};
  return _threeMods;
}
async function makeViewer(host, opts){
  opts=opts||{};
  host.classList.add('viewer3d');
  host.innerHTML=`<div class="v3d-msg"><div class="spin"></div><span>Loading 3D model…</span></div>`;
  let disposed=false, raf=0, visible=true, io=null, ro=null;
  const handle={dispose(){cleanup()}};
  function fail(msg){ if(disposed)return; host.innerHTML=`<div class="v3d-msg"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 9v4m0 4h.01M10.3 3.9l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3.1l-8-14a2 2 0 0 0-3.4 0z"/></svg><span>${msg||'Could not load 3D model.'}</span></div>`; }
  let renderer,scene,camera,controls,THREE;
  try{
    const mods=await loadThree(); THREE=mods.THREE;
    if(disposed)return handle;
    if(!opts.url){ fail('No model attached.'); return handle; }
    host.innerHTML='';
    renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.setSize(host.clientWidth||480,host.clientHeight||320,false);
    renderer.outputColorSpace=THREE.SRGBColorSpace;
    renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
    host.appendChild(renderer.domElement);
    scene=new THREE.Scene();
    camera=new THREE.PerspectiveCamera(45,(host.clientWidth||480)/(host.clientHeight||320),0.01,2000);
    const pmrem=new THREE.PMREMGenerator(renderer);
    scene.environment=pmrem.fromScene(new mods.RoomEnvironment(),0.04).texture;
    scene.add(new THREE.AmbientLight(0xffffff,0.35));
    const key=new THREE.DirectionalLight(0xffffff,2.1); key.position.set(4,6,5); scene.add(key);
    const fill=new THREE.DirectionalLight(0x88aaff,0.7); fill.position.set(-5,2,-3); scene.add(fill);
    controls=new mods.OrbitControls(camera,renderer.domElement);
    controls.enableDamping=true; controls.dampingFactor=.08;
    controls.autoRotate=opts.autorotate!==false; controls.autoRotateSpeed=1.1;
    const root=await loadModel(mods,opts);
    if(disposed){ cleanup(); return handle; }
    scene.add(root); frameObject(THREE,root,camera,controls);
    const hint=document.createElement('div'); hint.className='v3d-hint'; hint.textContent='Drag · scroll to zoom'; host.appendChild(hint);
    const rb=document.createElement('button'); rb.className='v3d-rotbtn'; rb.type='button';
    const setLbl=()=>rb.textContent=controls.autoRotate?'❚❚':'▶';
    setLbl(); rb.onclick=()=>{controls.autoRotate=!controls.autoRotate;setLbl()}; host.appendChild(rb);
    ro=new ResizeObserver(()=>{const w=host.clientWidth||480,h=host.clientHeight||320;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}); ro.observe(host);
    io=new IntersectionObserver(es=>{visible=es[0].isIntersecting;if(visible)tick();},{threshold:0.02}); io.observe(host);
    function tick(){ if(disposed||!visible){raf=0;return;} controls.update(); renderer.render(scene,camera); raf=requestAnimationFrame(tick); }
    tick();
  }catch(e){ console.warn('[PF3D] viewer error',e); fail('Could not load the 3D viewer.'); }
  function cleanup(){
    disposed=true; if(raf)cancelAnimationFrame(raf); io&&io.disconnect(); ro&&ro.disconnect();
    if(controls)controls.dispose();
    if(scene)scene.traverse(o=>{ if(o.geometry)o.geometry.dispose(); if(o.material){const m=Array.isArray(o.material)?o.material:[o.material];m.forEach(x=>{for(const k in x){const v=x[k];if(v&&v.isTexture)v.dispose();}x.dispose&&x.dispose();});} });
    if(renderer){renderer.dispose(); renderer.forceContextLoss&&renderer.forceContextLoss(); const c=renderer.domElement; c&&c.parentNode&&c.parentNode.removeChild(c);}
  }
  return handle;
}
async function loadModel(mods,opts){
  const {THREE}=mods; const kind=(opts.kind||'').toLowerCase();
  if(kind==='obj'){
    const obj=await new mods.OBJLoader().loadAsync(opts.url);
    obj.traverse(o=>{ if(o.isMesh && (!o.material || !o.material.isMeshStandardMaterial)) o.material=new THREE.MeshStandardMaterial({color:0xbfc7d4,metalness:.1,roughness:.65}); });
    return obj;
  }
  const gltf=await new mods.GLTFLoader().loadAsync(opts.url);
  return gltf.scene||gltf.scenes[0];
}
function frameObject(THREE,obj,camera,controls){
  const box=new THREE.Box3().setFromObject(obj);
  const size=box.getSize(new THREE.Vector3()), center=box.getCenter(new THREE.Vector3());
  obj.position.sub(center);
  const maxDim=Math.max(size.x,size.y,size.z)||1;
  const fov=camera.fov*(Math.PI/180); const dist=Math.abs(maxDim/2/Math.tan(fov/2))*1.6;
  camera.near=maxDim/100; camera.far=maxDim*100; camera.updateProjectionMatrix();
  camera.position.set(dist*0.7,dist*0.5,dist); camera.lookAt(0,0,0);
  controls.target.set(0,0,0); controls.minDistance=maxDim*0.4; controls.maxDistance=maxDim*8; controls.update();
}
window.PF3D={makeViewer};
window.dispatchEvent(new Event('pf3d-ready'));
</script>

/* ===== PAGE-BUILDER SCHEMA (freeform whole-page mode) =====
   CONFIG.page = { enabled, width, sections:[Section], transitions:[TransitionNode] }
   Section  = { id,name,role('intro'|'work'|'contact'|'custom'),height,bg,elements:[Element] }
   Element  = { id,type,x,y,w,h,z,rot,radius, ...type-specific }
     types: text | image | model3d | project-cards | rich-text | social-links | button
   transitions[i] sits BETWEEN section i and i+1 (so length = sections.length-1)
     TransitionNode = { type('fade'|'slide'|'zoom'|'3d-rotate'), enabled, options:{duration,distance,direction,easing,intensity} } */
/* PAGE_W declared near top of script (needed at load time by starterPage/normalize) */
function pgUid(p){return (p||'e')+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function defTransition(type){
  return {type:type||'fade',enabled:true,options:{duration:800,distance:60,direction:'up',easing:'cubic-bezier(.2,.7,.2,1)',intensity:12}};
}

/* Backfill/repair a page object so older or partial configs keep working. */
function normalizePage(pg){
  pg=pg||{}; if(typeof pg.enabled!=='boolean')pg.enabled=!!pg.enabled;
  pg.width=+pg.width||PAGE_W;
  pg.grid=Object.assign({cols:12,cellH:80},pg.grid||{});
  pg.grid.cols=Math.max(2,Math.min(24,+pg.grid.cols||12)); pg.grid.cellH=Math.max(30,+pg.grid.cellH||80);
  if(!Array.isArray(pg.sections))pg.sections=[];
  pg.sections.forEach(s=>{
    s.id=s.id||pgUid('s'); s.name=s.name||'Section'; s.role=s.role||'custom';
    s.height=+s.height||560; if(s.bg==null)s.bg='transparent';
    s.mode=(s.mode==='grid')?'grid':'freeform';
    if(!Array.isArray(s.elements))s.elements=[];
    s.elements.forEach(e=>{ e.id=e.id||pgUid('e'); e.x=+e.x||0; e.y=+e.y||0;
      e.w=Math.max(24,+e.w||120); e.h=Math.max(20,+e.h||60); e.z=+e.z||1; });
  });
  if(!Array.isArray(pg.transitions))pg.transitions=[];
  // keep transitions length == sections-1 (one node between each pair)
  const need=Math.max(0,pg.sections.length-1);
  while(pg.transitions.length<need)pg.transitions.push(defTransition('fade'));
  pg.transitions.length=need;
  pg.transitions.forEach(t=>{ t.type=t.type||'fade'; if(typeof t.enabled!=='boolean')t.enabled=t.enabled!==false;
    t.options=Object.assign({duration:800,distance:60,direction:'up',easing:'cubic-bezier(.2,.7,.2,1)',intensity:12},t.options||{}); });
  return pg;
}
/* backfill new fields so older saved configs keep working */
function normalize(c){
  c.profile=c.profile||{}; c.socials=c.socials||[]; c.projects=c.projects||[];
  c.theme=c.theme||JSON.parse(JSON.stringify(DEFAULT.theme));
  c.layout=c.layout||JSON.parse(JSON.stringify(DEFAULT.layout));
  c.projects.forEach(p=>{ if(!('modelId' in p))p.modelId=p.modelId||null; });
  if(!c.canvas)c.canvas={enabled:false,width:1000,height:560,bg:'var(--surface)',title:'Showcase',elements:[]};
  if(!Array.isArray(c.canvas.elements))c.canvas.elements=[];
  if(!c.page)c.page=starterPage();          // brand-new: seed a polished starter page (opt-in via toggle)
  c.page=normalizePage(c.page);
  return c;
}

/* ===== INDEXEDDB ===== */
const DB='pfDB',ST='assets';
function idb(){return new Promise((res,rej)=>{try{const q=indexedDB.open(DB,1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(ST))q.result.createObjectStore(ST,{keyPath:'id'})};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}catch(e){rej(e)}})}
async function loadAllAssets(){try{const db=await idb();const all=await new Promise(r=>{const t=db.transaction(ST,'readonly');const rq=t.objectStore(ST).getAll();rq.onsuccess=()=>r(rq.result||[]);rq.onerror=()=>r([])});all.forEach(a=>ASSETS[a.id]=a)}catch(e){}}
async function putAsset(rec){try{const db=await idb();await new Promise((res,rej)=>{const t=db.transaction(ST,'readwrite');t.objectStore(ST).put(rec);t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){}}
async function removeAsset(id){delete ASSETS[id];try{const db=await idb();await new Promise(res=>{const t=db.transaction(ST,'readwrite');t.objectStore(ST).delete(id);t.oncomplete=res;t.onerror=res})}catch(e){}}
function uid(){return 'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
/* classify by extension/mime — images, 3D models (.obj/.gltf/.glb), or generic */
function assetKind(file){
  const n=(file.name||'').toLowerCase(), t=(file.type||'').toLowerCase();
  if(/\.(glb|gltf|obj)$/.test(n)||t==='model/gltf-binary'||t==='model/gltf+json')return 'model3d';
  if(t.startsWith('image/')||/\.(png|jpe?g|webp|gif|svg|avif)$/.test(n))return 'image';
  return 'other';
}
function model3dExt(name){const n=(name||'').toLowerCase();if(n.endsWith('.obj'))return 'obj';if(n.endsWith('.gltf'))return 'gltf';return 'glb';}
async function ingest(file){
  if(!file){return null}
  const dataUrl=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});
  const kind=assetKind(file);
  const rec={id:uid(),name:file.name,type:file.type,dataUrl,kind,ts:Date.now()};
  if(kind==='model3d')rec.k3d=model3dExt(file.name);
  ASSETS[rec.id]=rec; await putAsset(rec); return rec;
}

function esc(s){return (s==null?'':''+s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}
function el(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild}
function hex(c){return /^#([0-9a-f]{6})$/i.test(c)?c:(/^#([0-9a-f]{3})$/i.test(c)?'#'+c.slice(1).split('').map(x=>x+x).join(''):'#4fc3f7')}
function shift(h,d){h=hex(h);let n=[1,3,5].map(i=>Math.max(0,Math.min(255,parseInt(h.substr(i,2),16)+d)));return '#'+n.map(x=>x.toString(16).padStart(2,'0')).join('')}

function renderPresets(){const g=document.getElementById('presetGrid');if(!g)return;
  g.innerHTML=Object.entries(PRESETS).map(([k,p])=>`<button class="pre ${CONFIG.theme.preset===k?'on':''}" onclick="applyPreset('${k}')">
    <div class="bar"><i style="background:${p.t.accent}"></i><i style="background:${p.t.accent2}"></i><i style="background:${p.t.bg}"></i></div>
    <div class="nm">${p.nm}</div><div class="ds">${p.ds}</div></button>`).join('')}
function applyPreset(k){const p=PRESETS[k];CONFIG.theme=Object.assign({},CONFIG.theme,JSON.parse(JSON.stringify(p.t)),{preset:k});sync();buildTheme();toast(p.nm+' theme applied')}
function setBg(v){CONFIG.theme.bg=v;CONFIG.theme.bg2=shift(v,CONFIG.theme.mode==='light'?-8:12);CONFIG.theme.preset='custom';sync()}
function toggleT(k,elm){const on=!(CONFIG.theme[k]!==false);/*flip*/ const cur=CONFIG.theme[k]!==false;CONFIG.theme[k]=!cur;elm.classList.toggle('on',!cur);CONFIG.theme.preset='custom';sync()}
function toggleL(k,elm){const cur=CONFIG.layout[k]!==false;CONFIG.layout[k]=!cur;elm.classList.toggle('on',!cur);sync()}
function updateModeBtn(){const b=document.getElementById('modeBtn');if(b)b.textContent=CONFIG.theme.mode==='light'?'☀ Light mode':'🌙 Dark mode'}
function toggleMode(){const light=CONFIG.theme.mode!=='light';applyModeDefaults(light?'light':'dark');updateModeBtn();buildTheme();toast((light?'Light':'Dark')+' mode')}
function applyModeDefaults(mode){const t=CONFIG.theme;t.mode=mode;
  if(mode==='light'){t.text='#171a21';t.muted='#5b6472';t.surface='rgba(255,255,255,.72)';t.border='rgba(15,23,42,.1)';if(shift(t.bg,0)==='#070d16'||isDarkHex(t.bg)){t.bg='#f3f5f9';t.bg2='#e9edf5'}}
  else{t.text='#eef4fb';t.muted='#93a4bd';t.surface='rgba(255,255,255,.05)';t.border='rgba(255,255,255,.12)';if(!isDarkHex(t.bg)){t.bg='#070d16';t.bg2='#0b1424'}}
  t.preset='custom';sync()}
function isDarkHex(h){h=hex(h);const l=0.299*parseInt(h.substr(1,2),16)+0.587*parseInt(h.substr(3,2),16)+0.114*parseInt(h.substr(5,2),16);return l<128}

/* ---- AI image generation via Pollinations.ai (open-source Flux/SD, keyless) ---- */
async function genAIImage(){
  const pIn=document.getElementById('imgPrompt'), dIn=document.getElementById('descIn');
  const prompt=((pIn&&pIn.value.trim())||(dIn&&dIn.value.trim())||'').slice(0,400);
  if(!prompt){toast('Describe the image first');return;}
  const size=(document.getElementById('imgAspect')||{}).value||'1024x768';
  const model=(document.getElementById('imgModel')||{}).value||'flux';
  const [w,h]=size.split('x');
  const btn=document.getElementById('genImgBtn'), prev=document.getElementById('genPrev');
  if(btn){btn.disabled=true;btn.textContent='Generating…';}
  if(prev)prev.innerHTML='<div class="genspin"></div>';
  if(prev)prev.insertAdjacentHTML('beforeend','<div class="genwait">Painting with an open model — can take 10–30s…</div>');
  const seed=Math.floor(Math.random()*1e7);
  const url=`https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=${w}&height=${h}&nologo=true&model=${encodeURIComponent(model)}&seed=${seed}`;
  const saveAsset=async(dataUrl,linked)=>{
    const rec={id:uid(),name:'AI · '+prompt.slice(0,42),type:'image/jpeg',dataUrl,kind:'image',ts:Date.now(),ai:true,remote:!!linked};
    ASSETS[rec.id]=rec; await putAsset(rec); sync(); return rec;
  };
  // load via <img> so it displays reliably; upgrade to a portable data URL via canvas when CORS allows
  const tryLoad=useCORS=>new Promise((res,rej)=>{const im=new Image();if(useCORS)im.crossOrigin='anonymous';im.onload=()=>res(im);im.onerror=()=>rej(new Error('load'));im.src=url;});
  try{
    let im,dataUrl=url,linked=true;
    try{ im=await tryLoad(true);
      try{ const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext('2d').drawImage(im,0,0);dataUrl=c.toDataURL('image/jpeg',0.92);linked=false; }catch(e){}
    }catch(e){ await tryLoad(false); } // display works even without CORS; keep the URL
    const rec=await saveAsset(dataUrl,linked);
    if(prev)prev.innerHTML=`<img src="${dataUrl}" alt="generated image"><div class="genok">✓ Saved to your Files library${linked?' (linked)':''}.</div>
      <div class="genactions"><button class="tbtn" onclick="U('profile','avatarId','${rec.id}');buildContent();toast('Set as avatar')">Use as avatar</button>
      <button class="tbtn" onclick="switchTab('files')">Open Files ↗</button></div>`;
    toast('Image generated & saved');
  }catch(err){
    if(prev)prev.innerHTML='<div class="genfail">Couldn’t reach the image service. Check your connection and try again.</div>';
    toast('Generation failed');
  }
  if(btn){btn.disabled=false;btn.textContent='✦ Generate image';}
}

const FAM={
 blue:{a:'#4fc3f7',b:'#7c9cff',d:['#070d16','#0b1424'],l:['#f2f6fc','#e7eef8']},
 cyan:{a:'#22d3ee',b:'#38bdf8',d:['#05101a','#08182a'],l:['#eef7fb','#e2f0f6']},

 pink:{a:'#ff8fd8',b:'#ff6aa9',d:['#140812','#200c1c'],l:['#fdf1f8','#f8e2f0']},
 rose:{a:'#fb7185',b:'#f472b6',d:['#140809','#200c12'],l:['#fdf1f2','#f8e2e6']},
 red:{a:'#ff6b6b',b:'#ff9558',d:['#140707','#200c0a'],l:['#fdf1f1','#f8e4e2']},
 orange:{a:'#ff9558',b:'#ffb84d',d:['#140b06','#201409'],l:['#fdf5ee','#f8ece0']},
 amber:{a:'#fbbf24',b:'#fb923c',d:['#140f05','#201709'],l:['#fdf8ec','#f7efd9']},
 gold:{a:'#e9c46a',b:'#f4a261',d:['#14100a','#201a0f'],l:['#faf6ec','#f2ead6']},
 yellow:{a:'#facc15',b:'#a3e635',d:['#12120a','#1c1c0f'],l:['#fbfaea','#f4f3d6']},
 mono:{a:'#cbd5e1',b:'#94a3b8',d:['#0a0c10','#12151b'],l:['#f4f5f7','#e9ebef']},
 slate:{a:'#94a3b8',b:'#64748b',d:['#0a0e16','#111726'],l:['#f3f5f9','#e7ebf2']}
};
const SYN={ocean:'blue',sky:'blue',sea:'cyan',aqua:'cyan',water:'cyan',mint:'teal',emerald:'teal',forest:'green',nature:'green',leaf:'green',grass:'green',grape:'purple',royal:'purple',magenta:'purple',lavender:'violet',indigo:'violet',blossom:'pink',sakura:'pink',coral:'rose',fire:'red',lava:'red',crimson:'red',ruby:'red',sunset:'orange',tangerine:'orange',peach:'orange',honey:'amber',luxury:'gold',premium:'gold',champagne:'gold',sunshine:'yellow',grayscale:'mono',greyscale:'mono',monochrome:'mono',neutral:'mono',steel:'slate',graphite:'slate'};
function describeToTheme(text){
  const t=(' '+(text||'').toLowerCase()+' ');const has=(...k)=>k.some(w=>t.includes(w));
  const words=new Set(t.split(/[^a-z0-9]+/).filter(Boolean));const hasWord=(...k)=>k.some(w=>words.has(w));
  const base=JSON.parse(JSON.stringify(CONFIG.theme));const notes=[];
  // mode
  let mode=base.mode;if(has('light','bright','white','airy','daylight'))mode='light';if(has('dark','night','midnight','black'))mode='dark';
  applyModeToBase(base,mode);
  // color (match whole words so "monospace" != mono, "frosted" != red)
  let fam=null;words.forEach(w=>{if(FAM[w])fam=w;else if(SYN[w])fam=SYN[w]});
  if(fam){const F=FAM[fam];base.accent=F.a;base.accent2=F.b;const bgp=mode==='light'?F.l:F.d;base.bg=bgp[0];base.bg2=bgp[1];
    if(fam==='mono'&&mode==='light'){base.accent='#111827';base.accent2='#4b5563'}
    notes.push(fam)}
  // style flags
  if(has('glass','frosted','glassmorphism','blur','translucent')){base.glass=true;base.blur=Math.max(base.blur,20);notes.push('glass')}
  if(has('flat','solid','opaque','no blur','no-glass')){base.glass=false;base.blur=0;notes.push('flat')}
  if(has('minimal','clean','simple','plain','understated')){base.orbs=false;base.radius=Math.min(base.radius,10);notes.push('minimal')}
  if(has('neon','vibrant','glow','electric','bold','punchy','vivid')){base.orbs=true;base.blur=Math.max(base.blur,20);notes.push('vibrant')}
  if(has('rounded','soft','friendly','pill','bubbly','round')){base.radius=28;notes.push('rounded')}
  if(has('playful','fun','quirky')){base.radius=Math.max(base.radius,24);base.font=FONTS['Poppins'];base.headfont=FONTS['Poppins'];notes.push('playful')}
  if(has('sharp','edgy','angular','brutal','brutalist')){base.radius=4;notes.push('sharp');if(has('brutal','brutalist')){base.glass=false;base.blur=0;base.font=FONTS['JetBrains Mono']}}
  if(has('professional','corporate','business','serious','enterprise')){base.radius=Math.min(base.radius,10);base.orbs=false;base.font=FONTS['Inter'];base.headfont=FONTS['Inter'];notes.push('professional')}
  if(has('elegant','luxury','premium','editorial','sophisticated','refined')){base.headfont=FONTS['Playfair Display'];base.radius=Math.min(base.radius,10);if(!fam){base.accent='#e9c46a';base.accent2='#f4a261'}notes.push('elegant')}
  if(has('retro','80s','synthwave','vaporwave')){applyModeToBase(base,'dark');base.accent='#b892ff';base.accent2='#ff6aa9';base.bg='#0b0714';base.bg2='#180a24';base.orbs=true;base.blur=22;notes.push('retro')}
  if(has('terminal','hacker','matrix')){applyModeToBase(base,'dark');base.accent='#3ff08a';base.accent2='#2dd4bf';base.bg='#03110a';base.bg2='#04150d';base.glass=false;base.blur=0;base.font=FONTS['JetBrains Mono'];base.headfont=FONTS['JetBrains Mono'];base.radius=6;notes.push('terminal')}
  if(hasWord('serif')){base.headfont=FONTS['Playfair Display'];notes.push('serif')}
  if(hasWord('mono','monospace','code','developer')){base.font=FONTS['JetBrains Mono'];notes.push('mono')}
  if(has('spacious','roomy','breathable')){base.density='spacious';notes.push('spacious')}
  if(has('compact','dense','tight')){base.density='compact';notes.push('compact')}
  // fonts by name
  for(const f in FONTS)if(t.includes(f.toLowerCase())){base.font=FONTS[f];notes.push(f)}
  // layout hints
  const layoutPatch={};
  if(has('centered','center'))layoutPatch.heroStyle='centered';
  if(has('two column','2 column','two-column'))layoutPatch.columns=2;
  if(has('four column','4 column'))layoutPatch.columns=4;
  base.preset='custom';
  return {theme:base,layout:layoutPatch,notes:[...new Set(notes)]};
}
function applyModeToBase(base,mode){base.mode=mode;
  if(mode==='light'){base.text='#171a21';base.muted='#5b6472';base.surface='rgba(255,255,255,.72)';base.border='rgba(15,23,42,.1)';if(isDarkHex(base.bg)){base.bg='#f3f5f9';base.bg2='#e9edf5'}}
  else{base.text='#eef4fb';base.muted='#93a4bd';base.surface='rgba(255,255,255,.05)';base.border='rgba(255,255,255,.12)';if(!isDarkHex(base.bg)){base.bg='#070d16';base.bg2='#0b1424'}}}
function applyDescribe(){
  const v=(document.getElementById('descIn').value||'').trim();
  if(!v){toast('Describe the look you want first');return}
  const r=describeToTheme(v);
  CONFIG.theme=r.theme;Object.assign(CONFIG.layout,r.layout);sync();
  buildTheme();                                   // rebuild controls to reflect new values
  document.getElementById('descIn').value=v;      // restore text after rebuild
  const n=document.getElementById('descNote');
  n.textContent=r.notes.length?('Interpreted as → '+r.notes.join(' · ')):'Applied — tweak any control below to refine.';
  n.classList.add('show');
  toast('Theme updated from your description');
}
function quickDesc(elm){document.getElementById('descIn').value=elm.textContent;applyDescribe()}

function renderAssets(){const g=document.getElementById('assetGrid');if(!g)return;const ids=Object.keys(ASSETS);

/* Direct browser call to the Claude Messages API. Requires the special
   dangerous-direct-browser-access header. Model: fast Haiku (confirmed id). */
async function llmFormat(key,rec,text){
  const sys="You transform a raw file into a clean portfolio project entry. Respond ONLY with minified JSON: {\"title\":string,\"summary\":string(<=140 chars),\"description\":string(2-4 sentences, may use **markdown**),\"tags\":string[3-5],\"highlights\":string[2-4 short bullet phrases]}. No prose, no code fences.";
  const user=text
    ? `File name: ${rec.name}\nFile type: ${rec.type||'unknown'}\n\n--- FILE CONTENT (truncated) ---\n${text}`
    : `File name: ${rec.name}\nFile type: ${rec.type||'unknown'}\nThis is a binary/${rec.kind} file (no text extractable). Infer a sensible portfolio project from the filename and type.`;
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{
      'content-type':'application/json',
      'x-api-key':key,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body:JSON.stringify({
      model:'claude-haiku-4-5',
      max_tokens:700,
      messages:[{role:'user',content:user}],
      system:sys
    })
  });
  if(!res.ok){const t=await res.text().catch(()=>'');throw new Error('HTTP '+res.status+' '+t.slice(0,200));}
  const data=await res.json();
  const txt=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim();
  return parseLoose(txt);
}
/* tolerant JSON extraction from a model reply */
function parseLoose(s){
  if(!s)throw new Error('empty reply');
  let t=s.replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
  const a=t.indexOf('{'),b=t.lastIndexOf('}');
  if(a>=0&&b>a)t=t.slice(a,b+1);
  return JSON.parse(t);
}

/* No-key offline formatter: text files → derive title/summary/keywords;
   binaries/images → filename-based stub. Always returns a usable entry. */
function localFormat(rec,text){
  const base=(rec.name||'Untitled').replace(/\.[^.]+$/,'');
  const title=titleCase(base.replace(/[-_]+/g,' ').trim())||'Untitled Project';
  if(text&&text.trim()){
    let body=text;
    // JSON → pretty-flatten a bit; else strip markdown/code noise
    if(/\.json$/i.test(rec.name)){try{body=JSON.stringify(JSON.parse(text),null,1)}catch(e){}}
    const clean=body.replace(/[#>*`_~]+/g,' ').replace(/\r/g,'').replace(/\n{2,}/g,'\n').trim();
    const lines=clean.split('\n').map(l=>l.trim()).filter(Boolean);
    const summary=(lines.slice(0,2).join(' ').slice(0,140))||('A project derived from '+rec.name);
    const description=lines.slice(0,5).join(' ').slice(0,420)||summary;
    const highlights=lines.slice(2,6).map(l=>l.slice(0,90)).filter(l=>l.length>8);
    return {title,summary,description,tags:keywords(clean),highlights};
  }
  // binary / image / model
  const kindLbl=rec.kind==='image'?'image asset':rec.kind==='model3d'?'interactive 3D model':'file';
  return {title,summary:`A project showcasing this ${kindLbl}.`,
    description:`**${title}** — created from the ${kindLbl} \`${rec.name}\`. Add a description to tell its story.`,
    tags:[rec.kind==='model3d'?'3D':rec.kind==='image'?'Visual':'Asset', ...keywords(base)].slice(0,4),
    highlights:[]};
}
const STOP=new Set('the a an and or of to in for on with is are was were be been this that it as at by from into your you our we i using use built build made make create created project app application website web using new using'.split(' '));
function keywords(s){
  const freq={};(s.toLowerCase().match(/[a-z][a-z0-9+.#-]{2,}/g)||[]).forEach(w=>{if(STOP.has(w))return;freq[w]=(freq[w]||0)+1});
  return Object.keys(freq).sort((a,b)=>freq[b]-freq[a]).slice(0,4).map(titleCase);
}
function titleCase(s){return (s||'').replace(/\b\w/g,c=>c.toUpperCase())}

/* derive grid coords from any existing pixel coords so freeform layouts convert cleanly */
function ensureGridCoords(sec){
  const {cols,cellH}=gridCfg(); const cellW=(pg().width||PAGE_W)/cols;

    e.gx=Math.max(0,Math.min(cols-e.gw,Math.round((e.x||0)/cellW)));

    e.gy=Math.max(0,Math.round((e.y||0)/cellH)); } });

  host.style.width=Math.round(base*GE_ZOOM)+'px';
  const ch=Math.max(24,Math.round(cellH*GE_ZOOM));
  (GSLIST||[]).forEach(g=>{try{g.cellHeight(ch)}catch(e){}});
  host.querySelectorAll('.grid-stack').forEach(gs=>{gs.style.backgroundSize=`calc(100%/${cols}) ${ch}px`;});
  const lbl=document.getElementById('geZoomLbl'); if(lbl)lbl.textContent=Math.round(GE_ZOOM*100)+'%';
}

/* Render EVERY page section stacked in a scrollable canvas — each grid section as its own
   GridStack so you can scroll down and edit any section inline. */
function renderGridEditor(){
  const host=document.getElementById('gridEditor'); if(!host)return;
  const fh=document.getElementById('frameHost'); const prev=fh?fh.scrollTop:0;
  destroyGrid();
  if(typeof GridStack==='undefined'){host.innerHTML='<div class="ge-note">The grid library couldn\'t load (offline?). Reconnect and reopen Edit.</div>';return;}
  if(CV_MODE!=='page'){host.innerHTML='<div class="ge-note">Switch to <b>Page builder</b> in the Layout tab to arrange sections on this canvas.</div>';return;}
  const secs=pgSections();
  if(!secs.length){host.innerHTML='<div class="ge-note">No sections yet — add one below or in the Layout tab.<br><button class="addbtn" style="margin-top:12px" onclick="geAddSection()">+ Add section</button></div>';return;}
  const {cols,cellH}=gridCfg();
  secs.forEach(s=>{ if(s.mode==='grid')ensureGridCoords(s); });
  host.innerHTML=secs.map((s,i)=>geSectionHTML(s,i,cols,cellH)).join('')
    +`<button class="addbtn ge-addsec" onclick="geAddSection()">+ Add section</button>`;
  GSLIST=[];
  secs.forEach(sec=>{
    if(sec.mode!=='grid')return;
    const block=host.querySelector(`.ge-sec[data-sid="${sec.id}"]`); if(!block)return;
    const gsEl=block.querySelector('.grid-stack'); if(!gsEl)return;
    const g=GridStack.init({column:cols,cellHeight:cellH,margin:8,float:true,
      draggable:{cancel:'.wt-edit,.wt-dup,.wt-del,.wbody[contenteditable=true],.wpop,.wpop *,input,select,textarea,button,a'},
      resizable:{handles:'e,se,s,sw,w,nw,n,ne'}},gsEl);
    g.on('change',(ev,nodes)=>{ (nodes||[]).forEach(n=>{const e=sec.elements.find(x=>x.id===n.id);if(e){e.gx=n.x;e.gy=n.y;e.gw=n.w;e.gh=n.h;}}); sync(); });
    GSLIST.push(g);
    wireGridInline(host,sec,block);
  });
  applyGeZoom();
  if(fh)fh.scrollTop=prev;
}
function geSectionHTML(sec,i,cols,cellH){
  const active=sec.id===PG_SEL;
  const head=`<div class="ge-sechd${active?' active':''}">
     <span class="ge-secname">${esc(sec.name||'Section '+(i+1))}</span>
     <span class="secrole">${esc(sec.role||'custom')}</span>
     ${sec.mode==='grid'?`<span class="ge-add">${gridAddButtons(sec.id)}</span>`:`<span style="margin-left:auto;font-size:11px;color:var(--mut)">Freeform</span>`}
   </div>`;
  if(sec.mode==='grid'){
    const items=(sec.elements||[]).map(e=>gridItemHTML(e)).join('');
    return `<div class="ge-sec${active?' active':''}" data-sid="${sec.id}" id="ge-sec-${sec.id}">${head}
      <div class="grid-stack" style="background-size:calc(100%/${cols}) ${cellH}px">${items}</div></div>`;

function gridWidgetBody(e){

function wph(ico,label){
  const I={image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
    cube:'<path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 12l9-5M12 12v10"/>',
    grid:'<rect x="3" y="4" width="7" height="7" rx="1"/><rect x="14" y="4" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="6" rx="1"/><rect x="14" y="14" width="7" height="6" rx="1"/>',
    share:'<circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.8l7.6-3.6M8.2 13.2l7.6 3.6"/>',
    box:'<rect x="4" y="4" width="16" height="16" rx="2"/>'};

function wireGridInline(host,sec,scope){
  const root=scope||host;

    const id=b.dataset.id;
    const save=()=>{const e=sec.elements.find(x=>x.id===id);if(e){e.text=b.innerText;sync();}};
    b.addEventListener('input',save); b.addEventListener('blur',save);
    b.addEventListener('pointerdown',ev=>ev.stopPropagation());
  });
  root.querySelectorAll('.grid-stack-item').forEach(it=>{
    it.addEventListener('pointerdown',()=>{host.querySelectorAll('.grid-stack-item').forEach(x=>x.classList.remove('sel'));it.classList.add('sel');PG_SEL=sec.id;});
  });
}
function gridAdd(sid,type){
  const sec=pgSections().find(s=>s.id===sid); if(!sec)return;
  const {cols}=gridCfg(); const [dw,dh]=GRID_DEFAULTS[type]||[4,2];
  const maxY=(sec.elements||[]).reduce((m,e)=>Math.max(m,(e.gy||0)+(e.gh||1)),0);
  const e={id:pgUid('e'),type,x:20,y:20,w:220,h:120,z:(sec.elements.reduce((m,x)=>Math.max(m,x.z||0),0))+1,
    gx:0,gy:maxY,gw:Math.min(cols,dw),gh:dh};
  if(type==='text')Object.assign(e,{text:'Your text',color:'#eef4fb',bg:'transparent',size:22,weight:700,align:'left',font:CANVAS_FONTS[0]});
  if(type==='rich-text')Object.assign(e,{text:'A longer description. **Markdown** works here.',color:'var(--txt)',bg:'transparent',size:16,weight:400,align:'left',font:CANVAS_FONTS[0]});
  if(type==='image')Object.assign(e,{assetId:(Object.values(ASSETS).find(a=>a.kind==='image')||{}).id||null,radius:12});
  if(type==='model3d')Object.assign(e,{assetId:(Object.values(ASSETS).find(a=>a.kind==='model3d')||{}).id||null,radius:12});
  if(type==='button')Object.assign(e,{text:'Get in touch',href:'{{mailto}}',variant:'primary',size:15,radius:13,align:'left'});
  if(type==='project-cards')Object.assign(e,{cols:3,gap:22});
  if(type==='social-links')Object.assign(e,{align:'left',gap:12});
  sec.elements.push(e); sync();
  if(PV_MODE!=='edit')setPvMode('edit'); else renderGridEditor();
  // make the new widget obvious: scroll it into view and flash it
  const content=document.querySelector(`.grid-stack-item-content[data-id="${e.id}"]`);
  const node=content?content.closest('.grid-stack-item'):null;
  if(node){ node.scrollIntoView({behavior:'smooth',block:'center'}); node.classList.add('flash'); setTimeout(()=>node.classList.remove('flash'),1000); }
  toast('Added '+type+' — drag to move, pull edges to resize');
}

function gridSetProp(id,k,v){
  const r=findEl(id);if(!r)return;const e=r.el;e[k]=v;sync();
  const content=document.querySelector(`.grid-stack-item-content[data-id="${id}"]`); if(!content)return;

  if((e.type==='text'||e.type==='rich-text')&&body){
    // apply typography live without destroying the editable text/caret
    body.style.fontSize=Math.min(+e.size||18,80)+'px';
    body.style.fontWeight=e.weight||600;
    body.style.textAlign=e.align||'left';
    body.style.color=(e.color&&e.color.charAt(0)==='#')?e.color:'var(--txt)';
    body.style.fontFamily=e.font||CANVAS_FONTS[0];

  }
  if(body){ const tmp=document.createElement('div');tmp.innerHTML=gridWidgetBody(e);const nb=tmp.querySelector('.wbody'); if(nb)body.replaceWith(nb); }

function cvRender(){

  const wrapEl=document.getElementById('cvWrap'), inspEl=document.getElementById('cvInspector');
  if(CV_MODE==='page'){ const asec=pgActiveSection(); if(asec&&asec.mode==='grid'){ if(wrapEl)wrapEl.style.display='none'; if(inspEl)inspEl.innerHTML=''; return; } }
  if(wrapEl)wrapEl.style.display='';
  const c=cv(), s=cvScale();
  const wrap=document.getElementById('cvWrap');
  wrap.style.height=(c.height*s)+'px';
  stage.style.width=c.width+'px'; stage.style.height=c.height+'px';
  stage.style.transform='scale('+s+')';
  stage.style.background=c.bg||'transparent';
  stage.querySelectorAll('.cvel').forEach(n=>n.remove());
  cvEls().slice().sort((a,b)=>(a.z||0)-(b.z||0)).forEach(e=>stage.appendChild(cvNode(e)));

function cvNode(e){

/* resolve {{profile}} tokens for editor previews (public render does the same) */
function tplPreview(str){
  const p=CONFIG.profile||{};

    .replace(/\{\{role\}\}/g,p.role||'')
    .replace(/\{\{tagline\}\}/g,p.tagline||'')
    .replace(/\{\{email\}\}/g,p.email||'you@example.com')
    .replace(/\{\{mailto\}\}/g,'mailto:'+(p.email||''))

}

const SNAP=10;
function snap(v){return Math.round(v/SNAP)*SNAP}
function cvSelect(id){ if(CVSEL===id)return; CVSEL=id;
  document.querySelectorAll('#cvStage .cvel').forEach(n=>{
    const on=n.dataset.id===id; n.classList.toggle('sel',on);
    n.querySelectorAll('.h').forEach(x=>x.remove());
    if(on){['nw','ne','sw','se','e','s'].forEach(h=>n.insertAdjacentHTML('beforeend','<span class="h '+h+'"></span>'));
      cvWireHandles(n,cvFind(id)); n.appendChild(n.querySelector('.lbl')||document.createComment(''));}
  });
  cvInspector();
}
function cvDragMove(node,e,ev){
  const s=cvScale(); const startX=ev.clientX,startY=ev.clientY,ox=e.x,oy=e.y;
  node.classList.add('dragging'); node.setPointerCapture(ev.pointerId);
  const move=m=>{ e.x=snap(ox+(m.clientX-startX)/s); e.y=snap(oy+(m.clientY-startY)/s);
    node.style.left=e.x+'px'; node.style.top=e.y+'px'; };
  const up=()=>{ node.classList.remove('dragging'); node.removeEventListener('pointermove',move); node.removeEventListener('pointerup',up); sync(); cvInspector(); };
  node.addEventListener('pointermove',move); node.addEventListener('pointerup',up);
}
function cvWireHandles(node,e){
  node.querySelectorAll('.h').forEach(h=>{
    h.addEventListener('pointerdown',ev=>{
      ev.preventDefault();ev.stopPropagation();
      const dir=h.className.replace('h','').trim(); const s=cvScale();
      const sx=ev.clientX,sy=ev.clientY,ox=e.x,oy=e.y,ow=e.w,oh=e.h; h.setPointerCapture(ev.pointerId);
      const move=m=>{ const dx=(m.clientX-sx)/s, dy=(m.clientY-sy)/s;
        if(dir.includes('e'))e.w=Math.max(24,snap(ow+dx));
        if(dir.includes('s'))e.h=Math.max(24,snap(oh+dy));
        if(dir.includes('w')){const nw=Math.max(24,snap(ow-dx));e.x=snap(ox+(ow-nw));e.w=nw;}
        if(dir.includes('n')){const nh=Math.max(24,snap(oh-dy));e.y=snap(oy+(oh-nh));e.h=nh;}
        Object.assign(node.style,{left:e.x+'px',top:e.y+'px',width:e.w+'px',height:e.h+'px'}); };
      const up=()=>{ h.removeEventListener('pointermove',move); h.removeEventListener('pointerup',up); sync(); cvInspector(); };
      h.addEventListener('pointermove',move); h.addEventListener('pointerup',up);
    });
  });
}
function cvWire(node,e){
  node.addEventListener('pointerdown',ev=>{
    if(ev.target.classList.contains('h'))return; // resize handled separately
    ev.preventDefault();
    cvSelect(e.id);          // ensure selected + handles present (no full re-render)
    cvDragMove(node,e,ev);   // begin drag on the same gesture
  });
  if(CVSEL===e.id)cvWireHandles(node,e); // handles already rendered by cvNode
}

function cvAdd(type){const z=(cvEls().reduce((m,e)=>Math.max(m,e.z||0),0))+1;
  const sizes={text:[260,80],'rich-text':[420,120],button:[190,52],'project-cards':[Math.min(1040,cv().width-80),480],'social-links':[320,60]};
  const dim=sizes[type]||[220,160];
  const e={id:pgUid('e'),type,x:40,y:40,w:dim[0],h:dim[1],z};
  if(type==='text')Object.assign(e,{text:'Your text',color:'var(--text)',bg:'transparent',size:24,weight:700,align:'left',font:CANVAS_FONTS[0]});
  if(type==='rich-text')Object.assign(e,{text:'Multi-line **rich text** with [links](#).\nSupports markdown.',color:'var(--muted)',bg:'transparent',size:16,weight:400,align:'left',font:CANVAS_FONTS[0]});
  if(type==='button')Object.assign(e,{text:'Click me',href:'#',variant:'primary',size:15,radius:13});
  if(type==='image')Object.assign(e,{assetId:null,radius:12,bg:'rgba(255,255,255,.06)'});
  if(type==='model3d')Object.assign(e,{assetId:null,radius:12});
  if(type==='project-cards')Object.assign(e,{cols:3,gap:22});
  if(type==='social-links')Object.assign(e,{align:'left',gap:12});
  cvEls().push(e);CVSEL=e.id;sync();cvRender()}
function cvAddImage(){const imgs=Object.values(ASSETS).filter(a=>a.kind==='image'||(a.type||'').startsWith('image/'));cvAdd('image');const e=cvFind(CVSEL);if(imgs[0]){e.assetId=imgs[0].id;sync();cvRender()}else toast('Tip: upload an image in Files, then pick it in the inspector')}
function cvAddModel(){const ms=Object.values(ASSETS).filter(a=>a.kind==='model3d');cvAdd('model3d');const e=cvFind(CVSEL);if(ms[0]){e.assetId=ms[0].id;sync();cvRender()}else toast('Tip: upload a .glb/.gltf/.obj in Files first')}

function cvInspector(){
  const box=document.getElementById('cvInspector'); if(!box)return;
  const e=cvFind(CVSEL);
  if(!e){box.innerHTML='<div class="cvempty">Select an element to edit it, or add one above.</div>';return;}
  const imgOpts=Object.values(ASSETS).filter(a=>a.kind==='image'||(a.type||'').startsWith('image/'));
  const modelOpts=Object.values(ASSETS).filter(a=>a.kind==='model3d');
  let type='';
  if(e.type==='text'||e.type==='rich-text'){
    const tokHint=`<div style="font-size:10.5px;color:var(--mut);margin:-4px 0 8px">Tokens: <code>{{name}}</code> <code>{{role}}</code> <code>{{tagline}}</code> <code>{{email}}</code></div>`;
    type=`
      <div class="f"><span>${e.type==='rich-text'?'Text (Markdown)':'Text'}</span><textarea style="${e.type==='rich-text'?'min-height:90px':''}" oninput="cvUp('text',this.value)">${esc(e.text||'')}</textarea></div>
      ${tokHint}
      <div class="row2">
        <div class="f"><span>Font size</span><input type="text" value="${e.size||20}" oninput="cvUp('size',+this.value||16)"></div>
        <div class="f"><span>Weight</span><select onchange="cvUp('weight',+this.value)">${[300,400,500,600,700].map(w=>`<option ${e.weight===w?'selected':''}>${w}</option>`).join('')}</select></div>
      </div>
      <div class="f"><span>Font</span><select onchange="cvUp('font',this.value)">${CANVAS_FONTS.map(f=>`<option value="${f}" ${e.font===f?'selected':''}>${f.split(',')[0].replace(/'/g,'')}</option>`).join('')}</select></div>
      <div class="f"><span>Align</span><select onchange="cvUp('align',this.value)">${['left','center','right'].map(a=>`<option ${e.align===a?'selected':''}>${a}</option>`).join('')}</select></div>
      ${e.type==='text'?`<div class="row2"><div class="f"><span>Letter spacing</span><input type="text" value="${e.letter||0}" oninput="cvUp('letter',+this.value||0)"></div>
        <div class="tog" style="align-self:end">Uppercase<div class="sw ${e.upper?'on':''}" onclick="cvUp('upper',!cvFind(CVSEL).upper);this.classList.toggle('on')"></div></div></div>`:''}
      <div class="colorrow"><label>Text color</label><div class="swatch" style="background:${hex(e.color||'#eef4fb')}"><input type="color" value="${hex(e.color||'#eef4fb')}" oninput="cvUp('color',this.value);this.parentNode.style.background=this.value"></div></div>
      <div class="colorrow"><label>Background</label><div class="swatch" style="background:${e.bg&&e.bg!=='transparent'?hex(e.bg):'#000'}"><input type="color" value="${e.bg&&e.bg!=='transparent'?hex(e.bg):'#000000'}" oninput="cvUp('bg',this.value);this.parentNode.style.background=this.value"></div>
        <button class="miniup" onclick="cvUp('bg','transparent');buildCanvas()">clear</button></div>`;
  } else if(e.type==='image'){
    type=`<div class="f"><span>Image asset</span><select onchange="cvUp('assetId',this.value||null)">
        <option value="">— none —</option>${imgOpts.map(a=>`<option value="${a.id}" ${e.assetId===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div>
      <div class="f"><span>Corner radius</span><input type="text" value="${e.radius||0}" oninput="cvUp('radius',+this.value||0)"></div>`;
  } else if(e.type==='model3d'){
    type=`<div class="f"><span>3D model</span><select onchange="cvUp('assetId',this.value||null)">
        <option value="">— none —</option>${modelOpts.map(a=>`<option value="${a.id}" ${e.assetId===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div>
      <div class="f"><span>Corner radius</span><input type="text" value="${e.radius||0}" oninput="cvUp('radius',+this.value||0)"></div>`;
  } else if(e.type==='button'){
    type=`<div class="f"><span>Label</span><input type="text" value="${esc(e.text||'')}" oninput="cvUp('text',this.value)"></div>
      <div class="f"><span>Link (href — <code>#work</code>, <code>{{mailto}}</code>, or URL)</span><input type="text" value="${esc(e.href||'')}" oninput="cvUp('href',this.value)"></div>
      <div class="row2">
        <div class="f"><span>Style</span><select onchange="cvUp('variant',this.value)">${['primary','ghost'].map(v=>`<option ${e.variant===v?'selected':''}>${v}</option>`).join('')}</select></div>
        <div class="f"><span>Font size</span><input type="text" value="${e.size||15}" oninput="cvUp('size',+this.value||15)"></div>
      </div>
      <div class="f"><span>Corner radius</span><input type="text" value="${e.radius!=null?e.radius:13}" oninput="cvUp('radius',+this.value||0)"></div>`;
  } else if(e.type==='project-cards'){
    type=`<div style="font-size:11.5px;color:var(--mut);margin-bottom:8px">Renders your live projects as interactive cards. Clicking a card opens the in-app project modal.</div>
      <div class="row2">
        <div class="f"><span>Columns</span><select onchange="cvUp('cols',+this.value)">${[1,2,3,4].map(n=>`<option ${e.cols===n?'selected':''}>${n}</option>`).join('')}</select></div>
        <div class="f"><span>Gap (px)</span><input type="text" value="${e.gap||22}" oninput="cvUp('gap',+this.value||0)"></div>
      </div>`;
  } else if(e.type==='social-links'){
    type=`<div style="font-size:11.5px;color:var(--mut);margin-bottom:8px">Renders your social links (from Content) as icons that open in a new tab.</div>
      <div class="row2">
        <div class="f"><span>Align</span><select onchange="cvUp('align',this.value)">${['left','center','right'].map(a=>`<option ${e.align===a?'selected':''}>${a}</option>`).join('')}</select></div>
        <div class="f"><span>Gap (px)</span><input type="text" value="${e.gap||12}" oninput="cvUp('gap',+this.value||0)"></div>
      </div>`;
  }
  box.innerHTML=`<div class="insp">
    <div class="ihd"><span>${e.type} element</span><button onclick="cvDel()">Delete</button></div>
    <div class="row2">
      <div class="f"><span>X</span><input type="text" value="${e.x}" oninput="cvUp('x',+this.value||0)"></div>
      <div class="f"><span>Y</span><input type="text" value="${e.y}" oninput="cvUp('y',+this.value||0)"></div>
    </div>
    <div class="row2">
      <div class="f"><span>Width</span><input type="text" value="${e.w}" oninput="cvUp('w',Math.max(24,+this.value||24))"></div>
      <div class="f"><span>Height</span><input type="text" value="${e.h}" oninput="cvUp('h',Math.max(24,+this.value||24))"></div>
    </div>
    <div class="f"><span>Rotation (°)</span><input type="text" value="${e.rot||0}" oninput="cvUp('rot',+this.value||0)"></div>
    ${type}
    <div style="margin-top:10px"><div style="font-size:11px;color:var(--mut);margin-bottom:6px">Layering</div>
      <div class="minibtns">
        <button onclick="cvLayer('front')">Bring front</button>
        <button onclick="cvLayer('back')">Send back</button>
        <button onclick="cvLayer('up')">Forward</button>
        <button onclick="cvLayer('down')">Backward</button>
      </div></div>
  </div>`;
}
function cvUp(k,v){const e=cvFind(CVSEL);if(!e)return;e[k]=v;sync();cvRender()}
function cvDel(){const i=cvEls().findIndex(e=>e.id===CVSEL);if(i>=0){cvEls().splice(i,1);CVSEL=null;sync();cvRender()}}
function cvLayer(dir){const e=cvFind(CVSEL);if(!e)return;const zs=cvEls().map(x=>x.z||0);const max=Math.max(...zs),min=Math.min(...zs);
  if(dir==='front')e.z=max+1; else if(dir==='back')e.z=min-1; else if(dir==='up')e.z=(e.z||0)+1; else e.z=(e.z||0)-1;
  // normalize to 1..n
  cvEls().slice().sort((a,b)=>(a.z||0)-(b.z||0)).forEach((x,idx)=>x.z=idx+1);
  sync();cvRender()}
window.addEventListener('resize',()=>{if(document.getElementById('cvStage'))cvRender()});

/* ================= TABS / TOOLBAR ================= */
function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===name));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='pane-'+name));
  if(name==='content')buildContent();if(name==='theme')buildTheme();if(name==='files')buildFiles();if(name==='canvas')buildCanvas();
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>switchTab(t.dataset.tab));
document.querySelectorAll('.vp button[data-vp]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.vp button[data-vp]').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  const f=document.getElementById('preview');f.className=b.dataset.vp==='desktop'?'':b.dataset.vp;
});
document.querySelectorAll('.pvmode button[data-pm]').forEach(b=>b.onclick=()=>setPvMode(b.dataset.pm));

function openPortfolio(){persist();window.open('index.html','_blank')}
function doExport(){
  const data={config:CONFIG,assets:Object.values(ASSETS),exportedAt:new Date().toISOString(),v:1};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='portfolio-'+(CONFIG.profile.name||'site').toLowerCase().replace(/\s+/g,'-')+'.json';a.click();
  toast('Exported portfolio + assets');
}
function doImport(){const inp=document.createElement('input');inp.type='file';inp.accept='application/json';
  inp.onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());
    if(data.config)CONFIG=data.config;for(const id in ASSETS)delete ASSETS[id];
    if(Array.isArray(data.assets)){for(const rec of data.assets){ASSETS[rec.id]=rec;await putAsset(rec)}}
    persist();pushPreview();switchTab('content');toast('Imported successfully')}catch(err){toast('Invalid file')}};
  inp.click();
}

/* ================= BOOT ================= */
(async function boot(){
  await loadAllAssets();
  buildContent();
  pushPreview();
})();
</script>
